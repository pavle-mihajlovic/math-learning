name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install sympy
      - run: npm run check
      - run: npm test
      - run: npm run validate -- --quiet
      - run: python3 scripts/verify_sympy.py --selftest && python3 scripts/verify_sympy.py
      - run: npm run build
